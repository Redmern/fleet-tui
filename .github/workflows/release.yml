name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  # Stops the release before anything is built when RELEASE_NOTES.md has no
  # entry for the tag; publish uses that entry as the GitHub release text.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the release notes
        run: sh scripts/release-notes.sh "${{ github.event.inputs.tag || github.ref_name }}"

  build:
    name: ${{ matrix.rid }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: fleet-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            asset: fleet-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # libghostty-vt for the embedded multiplexer, exactly as in ci.yml (same
      # pins, same cache key, so a release reuses CI's cache).
      - uses: actions/cache@v4
        with:
          path: artifacts/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('scripts/ghostty/pins.env') }}

      - name: Build libghostty-vt
        shell: pwsh
        run: |
          if ($IsWindows) { ./scripts/ghostty/build.ps1 } else { bash scripts/ghostty/build.sh }

      # Fleet.csproj links the archive only when it exists, so without this a
      # release would quietly ship without the embedded multiplexer.
      - name: Check libghostty-vt will be linked
        shell: bash
        run: |
          lib=artifacts/ghostty/${{ matrix.rid }}/lib
          archive=$([ "${{ runner.os }}" = Windows ] && echo "$lib/ghostty-vt-static.lib" || echo "$lib/libghostty-vt.a")
          [ -f "$archive" ] || { echo "::error::$archive is missing; the release would ship without the embedded multiplexer"; exit 1; }
          ls -la "$archive"

      - name: Test
        run: dotnet test Fleet.slnx --nologo -v minimal

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          dotnet publish src/Fleet/Fleet.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:Version="${tag#v}" \
            -o out/${{ matrix.rid }} --nologo

      - name: Name the asset and hash it
        shell: bash
        run: |
          mkdir -p dist
          built=out/${{ matrix.rid }}/fleet
          [ -f "$built.exe" ] && built="$built.exe"
          cp "$built" "dist/${{ matrix.asset }}"
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # A tag with a suffix (v0.6.0-rc.1) is a prerelease: GitHub never makes
        # it "latest", so `fleet update` (which asks for the latest release)
        # does not hand it to everyone; `fleet update <tag>` still installs it.
        run: |
          kind=()
          case "$TAG" in *-*) kind=(--prerelease) ;; esac
          {
            sh scripts/release-notes.sh "$TAG"
            echo
            echo "Native binaries for Windows and Linux. Install with scripts/get-fleet.ps1 or scripts/get-fleet.sh, then run 'fleet setup'."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* "${kind[@]}" \
              --title "fleet $TAG" \
              --notes-file notes.md
          fi
