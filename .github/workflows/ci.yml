name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT links with clang on Linux; Windows runners already have MSVC.
      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # libghostty-vt for the embedded multiplexer, at the pins in
      # scripts/ghostty/pins.env. The cache holds the Zig toolchain, the ghostty
      # source and Zig's own package cache; a cold build takes several minutes.
      - uses: actions/cache@v4
        with:
          path: artifacts/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('scripts/ghostty/pins.env') }}

      - name: Build libghostty-vt
        shell: pwsh
        run: |
          if ($IsWindows) { ./scripts/ghostty/build.ps1 } else { bash scripts/ghostty/build.sh }

      # Fleet.csproj links the archive only when it exists; fail rather than
      # test and publish a binary without the embedded multiplexer.
      - name: Check libghostty-vt will be linked
        shell: bash
        run: |
          lib=artifacts/ghostty/${{ matrix.rid }}/lib
          archive=$([ "${{ runner.os }}" = Windows ] && echo "$lib/ghostty-vt-static.lib" || echo "$lib/libghostty-vt.a")
          [ -f "$archive" ] || { echo "::error::$archive is missing; the build would have no embedded multiplexer"; exit 1; }
          ls -la "$archive"

      - name: Test
        run: dotnet test Fleet.slnx --nologo -v minimal

      - name: Publish (NativeAOT)
        run: >
          dotnet publish src/Fleet/Fleet.csproj
          -c Release -r ${{ matrix.rid }}
          -o out/${{ matrix.rid }} --nologo

      # Proves the binary actually links and starts on this platform, which is
      # the whole point of running the matrix. doctor exits 1 without a mux, so
      # help is the check that must succeed.
      - name: Smoke test
        shell: bash
        run: |
          exe=out/${{ matrix.rid }}/fleet
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --help
          "$exe" doctor || true

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/fleet*
          if-no-files-found: error
